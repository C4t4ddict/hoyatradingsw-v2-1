name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python tests and compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install research dependencies when present
        shell: bash
        run: |
          if [[ -f research/requirements.txt ]]; then
            python -m pip install -r research/requirements.txt
          fi
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall backend
      - name: Compile root Python modules
        shell: bash
        run: find . -maxdepth 1 -type f -name '*.py' -print0 | xargs -0 -r python -m py_compile

  frontend:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
